services:
  db:
    shm_size: "256mb"
    ports: []

  api:
    ports: []
    volumes:
      - ./backups:/backup-health:ro
    environment:
      API_BUILD: "paper-20260118-1"
    networks:
      default:
      trading-edge:
        aliases:
          - paper-api

  frontend:
    profiles: ["legacy-paper-ui"]
    ports: []
    networks:
      default:
      trading-edge:
        aliases:
          - paper-frontend

  bot-runner:
    build:
      context: .
      dockerfile: services/bot_runner/Dockerfile
      args:
        GIT_SHA: ${REVISION:?set REVISION to the canonical full git SHA}
    env_file:
      - ${ENV_FILE}
    environment:
      GIT_SHA: ${REVISION:?set REVISION to the canonical full git SHA}
      FINAL_DECISION_PRODUCER_AUDIT_LEDGER_ENABLED: ${BOT_RUNNER_FINAL_DECISION_PRODUCER_AUDIT_LEDGER_ENABLED:-0}
      SUPERTREND_READY_CADENCE_SECONDS_V1: ${SUPERTREND_READY_CADENCE_SECONDS_V1:-60}
      SUPERTREND_CATCHUP_CADENCE_SECONDS_V1: ${SUPERTREND_CATCHUP_CADENCE_SECONDS_V1:-5}
      SUPERTREND_ERROR_CADENCE_SECONDS_V1: ${SUPERTREND_ERROR_CADENCE_SECONDS_V1:-60}
      SUPERTREND_PENDING_EVIDENCE_CADENCE_SECONDS_V1: ${SUPERTREND_PENDING_EVIDENCE_CADENCE_SECONDS_V1:-60}
      BOT_RUNNER_POLL_SECONDS: 5
      BOT_RUNNER_GRACE_SECONDS: 20
      BOT_RUNNER_RESTART_BACKOFF_SECONDS: 15
      BOT_VERSION: 2026-02-25_a_paper
      BBRANGE_EXPLORE_ENABLED: "true"
      BBRANGE_EXPLORE_MAX_TREND: "WEAK"
      BBRANGE_ENTRY_BB_OFFSET_PCT: "0.0003"
      BBRANGE_PAPER_TREATMENT_V1_ENABLED: ${BBRANGE_PAPER_TREATMENT_V1_ENABLED:-0}
      BBRANGE_PAPER_TREATMENT_V1_STARTED_AT: ${BBRANGE_PAPER_TREATMENT_V1_STARTED_AT:-}
      ECONOMIC_FLOOR_MODE: "V2_EVIDENCE_ONLY"
      ACTIVE_ECONOMIC_FLOOR_VERSION: "V2"
      ECONOMIC_FLOOR_AFTER_COST_COVER_V1_MODE: "SHADOW_ONLY"
      ECONOMIC_FLOOR_V2_MODE: "EVIDENCE_ONLY"
      FULL_PAPER_OPPORTUNITY_OBSERVATION_V1_ENABLED: "1"
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-5}"

  automation-runner:
    env_file:
      - ${ENV_FILE}
    environment:
      INTERNAL_API_BASE: http://paper-api:8000
      LEARNING_TELEMETRY_REFRESH_ENABLED: ${LEARNING_TELEMETRY_REFRESH_ENABLED:-0}
      LEARNING_TELEMETRY_LOOKBACK_HOURS: ${LEARNING_TELEMETRY_LOOKBACK_HOURS:-24}
      LEARNING_TELEMETRY_REFRESH_TIMEOUT_MS: ${LEARNING_TELEMETRY_REFRESH_TIMEOUT_MS:-300000}
      ENTRY_CONTEXT_SNAPSHOT_REFRESH_ENABLED: ${ENTRY_CONTEXT_SNAPSHOT_REFRESH_ENABLED:-0}
      ENTRY_CONTEXT_SNAPSHOT_LOOKBACK_HOURS: ${ENTRY_CONTEXT_SNAPSHOT_LOOKBACK_HOURS:-6}
      THESIS_EVIDENCE_BUNDLE_V1_ENABLED: ${THESIS_EVIDENCE_BUNDLE_V1_ENABLED:-1}
      THESIS_SEMANTIC_CANDIDATE_FREEZE_V1_ENABLED: ${THESIS_SEMANTIC_CANDIDATE_FREEZE_V1_ENABLED:-1}
      FULL_PAPER_OPPORTUNITY_OBSERVATION_V1_ENABLED: "1"
    networks:
      - default
      - trading-edge

  bot-runner-orchestrator:
    build:
      context: .
      dockerfile: services/bot_runner_orchestrator/Dockerfile
      args:
        GIT_SHA: ${REVISION:?set REVISION to the canonical full git SHA}
    env_file:
      - ${ENV_FILE}
    environment:
      GIT_SHA: ${REVISION:?set REVISION to the canonical full git SHA}
      ORC_POLL_SECONDS: 10
      ORC_ACTIONS_ENABLED: ${ORC_ACTIONS_ENABLED:-false}
      BOT_VERSION: 2026-02-26_a__paper
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-5}"

  regime-worker:
    environment:
      BOT_VERSION: 2026-01-26_a_paper

networks:
  trading-edge:
    name: trading-edge
    external: true
