services:
  edge-nginx:
    image: nginx:stable
    container_name: edge-nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-5}"
    env_file:
      - .env.edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/templates:/etc/nginx/templates:ro
      - ./edge/acme:/var/www/certbot
      # odblokujesz po certach:
      - ./edge/certs:/etc/nginx/certs:ro
    networks:
      - trading-edge
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  trading-edge:
    name: trading-edge
    external: true