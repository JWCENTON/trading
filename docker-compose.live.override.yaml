services:
  db:
    shm_size: "256mb"
    ports: []

  api:
    ports: []
    volumes:
      - ./backups:/backup-health:ro
    environment:
      API_BUILD: "live-20260118-1"
    networks:
      default:
      trading-edge:
        aliases:
          - live-api

  frontend:
    ports: []
    networks:
      default:
      trading-edge:
        aliases:
          - live-frontend

  bot-runner:
    build:
      context: .
      dockerfile: services/bot_runner/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA}
    env_file:
      - ${ENV_FILE}
    environment:
      FINAL_DECISION_PRODUCER_AUDIT_LEDGER_ENABLED: ${FINAL_DECISION_PRODUCER_AUDIT_LEDGER_ENABLED:-0}
      SUPERTREND_READY_CADENCE_SECONDS_V1: ${SUPERTREND_READY_CADENCE_SECONDS_V1:-60}
      SUPERTREND_CATCHUP_CADENCE_SECONDS_V1: ${SUPERTREND_CATCHUP_CADENCE_SECONDS_V1:-5}
      SUPERTREND_ERROR_CADENCE_SECONDS_V1: ${SUPERTREND_ERROR_CADENCE_SECONDS_V1:-60}
      SUPERTREND_PENDING_EVIDENCE_CADENCE_SECONDS_V1: ${SUPERTREND_PENDING_EVIDENCE_CADENCE_SECONDS_V1:-60}
      BOT_RUNNER_POLL_SECONDS: 5
      BOT_RUNNER_GRACE_SECONDS: 20
      BOT_RUNNER_RESTART_BACKOFF_SECONDS: 15
      BOT_VERSION: 2026-02-25_a_live
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-5}"

  automation-runner:
    env_file:
      - ${ENV_FILE}
    environment:
      INTERNAL_API_BASE: http://live-api:8000
    networks:
      - default
      - trading-edge

  bot-runner-orchestrator:
    build:
      context: .
      dockerfile: services/bot_runner_orchestrator/Dockerfile
    env_file:
      - ${ENV_FILE}
    environment:
      ORC_POLL_SECONDS: 10
      ORC_ACTIONS_ENABLED: ${ORC_ACTIONS_ENABLED:-false}
      BOT_VERSION: 2026-02-26_a_live
    depends_on:
      - db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-5}"

  regime-worker:
    environment:
      DAILY_LOSS_SHADOW_SENTINEL: 1
      DAILY_LOSS_SENTINEL_STRATEGY: RISK
      DAILY_LOSS_SENTINEL_STRATEGIES: RSI,SUPER_TREND,BBRANGE,TREND
      BOT_VERSION: 2026-01-26_a_live

networks:
  trading-edge:
    name: trading-edge
    external: true
